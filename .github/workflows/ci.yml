name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  gateway:
    name: gateway + chat gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install gateway dependencies
        run: npm ci
        working-directory: server

      - name: Install MCP server dependencies
        run: npm ci
        working-directory: mcp-server

      - name: Syntax-check every source file
        run: |
          find server/src mcp-server scripts \( -name '*.js' -o -name '*.mjs' \) \
            -not -path '*/node_modules/*' \
            | xargs -r -n1 node --check

      - name: Smoke-test the chat-gate path (CORS + token field)
        run: node scripts/ci-smoke.mjs
