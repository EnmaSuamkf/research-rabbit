# Render Blueprint for the ResearchRabbit Copilot Stage 2 deployment.
# Two Node web services on the free plan. No Flowise here (that is Stage 3).
#
# Secrets (RR_SESSION_COOKIE, RR_PROJECT_ID) are `sync: false` — they are set
# in the Render dashboard only, never committed. The openalex backend does not
# need them, so they are left UNSET for Stage 2 (RR_BACKEND=openalex).
#
# In this stage the services are deployed manually via the dashboard
# "Public Git Repository" source tab; this file is the reproducible spec for a
# future Blueprint sync (once the Render GitHub App is granted access to the
# repo). The manual deploy uses the exact same values below.
services:
  - type: web
    name: researchrabbit-server
    runtime: node
    region: oregon
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: RR_BACKEND
        value: openalex
      - key: RR_API_BASE
        value: https://api.researchrabbit.ai
      - key: RR_APP_BASE
        value: https://app.researchrabbit.ai
      - key: RR_ALLOW_WRITES
        value: "false"
      - key: OPENALEX_MAILTO
        value: warren-copilot@example.com
      - key: CACHE_TTL_SECONDS
        value: "86400"
      - key: MAX_TOOL_CALLS_PER_CONV
        value: "40"
      - key: ALLOWED_ORIGINS
        value: https://researchrabbit-mcp-server.onrender.com,https://researchrabbit-site.onrender.com,http://localhost:3000,http://localhost:8088
      - key: RR_SESSION_COOKIE
        sync: false
      - key: RR_PROJECT_ID
        sync: false

  - type: web
    name: researchrabbit-mcp-server
    runtime: node
    region: oregon
    plan: free
    rootDir: mcp-server
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: GATEWAY_URL
        value: https://researchrabbit-server.onrender.com

  # ── Stage 3 · Flowise (Docker image web service) — added in §16.2 ──
  # Pinned to flowiseai/flowise:3.1.2 — :latest (3.1.4) and 3.1.3 are broken on
  # Render (missing @smithy/eventstream-codec, fatal ./utils/uuid export error).
  # Standard plan (2 GB) is required: free/Starter (512 MB) OOM-kills 3.1.2 during
  # init. The 1 GB persistent disk keeps the SQLite DB, credentials and agentflow
  # across redeploys. Deployed via the Render REST API (see site/agentflow.json);
  # this block is the reproducible Blueprint spec.
  - type: web
    name: researchrabbit-flowise
    runtime: image
    image:
      url: docker.io/flowiseai/flowise:3.1.2
    region: oregon
    plan: standard
    healthCheckPath: /
    disk:
      name: flowise-data
      mountPath: /opt/render/.flowise
      sizeGB: 1
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: HTTP_SECURITY_CHECK
        value: "false"
      - key: DATABASE_PATH
        value: /opt/render/.flowise
      - key: APIKEY_PATH
        value: /opt/render/.flowise
      - key: SECRETKEY_PATH
        value: /opt/render/.flowise
      - key: LOG_PATH
        value: /opt/render/.flowise/logs
      - key: BLOB_STORAGE_PATH
        value: /opt/render/.flowise/storage
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      - key: FLOWISE_USERNAME
        sync: false
      - key: FLOWISE_PASSWORD
        sync: false

  # ── Stage 3 · Static site (landing + docs + Connect panel) ──
  # Serves site/ as static HTML (no build step). The Connect-account panel
  # (Camino C) talks to the gateway's /api/rr/* endpoints, so the gateway's
  # ALLOWED_ORIGINS must include https://researchrabbit-site.onrender.com.
  - type: static_site
    name: researchrabbit-site
    branch: master
    rootDir: ""
    buildCommand: ""
    publishPath: site
    autoDeploy: true
